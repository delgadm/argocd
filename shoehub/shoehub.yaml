apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoehub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/delgadm/argocd.git
    targetRevision: main
    path: shoehub/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: shoehub
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
