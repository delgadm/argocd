# Monolithic single-binary deployment, per
# https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/
#
# Storage is the chart's built-in MinIO, intended by upstream for testing only.
# That subchart is deprecated and scheduled for removal on 2026-10-31 -
# swap loki.storage to an external S3-compatible bucket before then.
loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  rulerConfig:
    enable_api: true

ignoreMinioDeprecation: true
minio:
  enabled: true

# Defaults request ~9.8Gi (chunksCache) which exceeds this kind cluster's
# per-node allocatable memory (~8Gi), leaving the pod permanently Pending
# and blocking the rest of the sync behind it. Not needed for a single
# low-volume log source.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  route:
    main:
      enabled: true
      hostnames:
        - loki.local
      parentRefs:
        - name: monitoring-gateway
          sectionName: loki
          group: gateway.networking.k8s.io
          kind: Gateway

deploymentMode: Monolithic

singleBinary:
  replicas: 1

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
