# placeholder override to prove the values-file pipeline end-to-end
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        # Loki's existing auto-provisioned uid (unset above) - changing an
        # already-provisioned datasource's uid breaks Grafana's file-based
        # provisioning reconcile ("data source not found" on reload), so we
        # reference its current uid directly rather than pinning a new one.
        tracesToLogsV2:
          datasourceUid: P8E80F9AEF21F6940
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          tags: ["job", "instance", "pod", "namespace"]
          filterByTraceID: false
          filterBySpanID: false
        tracesToMetrics:
          datasourceUid: prometheus
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          tags:
            - key: service.name
              value: service
          queries:
            - name: "Request rate"
              query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
        serviceMap:
          datasourceUid: prometheus
  route:
    main:
      enabled: true
      hostnames:
        - grafana.local
      parentRefs:
        - name: monitoring-gateway
          sectionName: grafana
          group: gateway.networking.k8s.io
          kind: Gateway

prometheus:
  route:
    main:
      enabled: true
      hostnames:
        - prometheus.local
      parentRefs:
        - name: monitoring-gateway
          sectionName: prometheus
          group: gateway.networking.k8s.io
          kind: Gateway
  prometheusSpec:
    enableRemoteWriteReceiver: true
    # Accept PodMonitor/ServiceMonitor resources from charts that don't
    # apply the "release: kube-prometheus-stack" label (e.g. unpoller),
    # rather than only the ones this chart itself creates.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: mac-studio-node-exporter
        static_configs:
          - targets:
              - 192.168.0.75:9100
