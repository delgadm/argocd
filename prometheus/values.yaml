# placeholder override to prove the values-file pipeline end-to-end
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
  route:
    main:
      enabled: true
      hostnames:
        - grafana.local
      parentRefs:
        - name: monitoring-gateway
          sectionName: grafana
          group: gateway.networking.k8s.io
          kind: Gateway

prometheus:
  route:
    main:
      enabled: true
      hostnames:
        - prometheus.local
      parentRefs:
        - name: monitoring-gateway
          sectionName: prometheus
          group: gateway.networking.k8s.io
          kind: Gateway
