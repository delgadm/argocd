# placeholder override to prove the values-file pipeline end-to-end
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
  route:
    main:
      enabled: true
      hostnames:
        - grafana.local
      parentRefs:
        - name: monitoring-gateway
          sectionName: grafana
          group: gateway.networking.k8s.io
          kind: Gateway

prometheus:
  route:
    main:
      enabled: true
      hostnames:
        - prometheus.local
      parentRefs:
        - name: monitoring-gateway
          sectionName: prometheus
          group: gateway.networking.k8s.io
          kind: Gateway
  prometheusSpec:
    enableRemoteWriteReceiver: true
    additionalScrapeConfigs:
      - job_name: raspberry-pi-node-exporter
        static_configs:
          - targets:
              - 192.168.0.117:9100
      - job_name: mac-studio-node-exporter
        static_configs:
          - targets:
              - 192.168.0.75:9100
